[project]
name = "codex-app-mcp"
version = "0.1.1"
description = "Local MCP bridge exposing Codex App Server threads/turns as the codex / codex-reply MCP tools (noninteractive compatibility subset)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yoshihiro Misawa" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "mcp==2.2.0",
    "openai-codex==0.154.0",
]

[project.urls]
Homepage = "https://github.com/PyYoshi/codex-app-mcp"
Repository = "https://github.com/PyYoshi/codex-app-mcp"
Issues = "https://github.com/PyYoshi/codex-app-mcp/issues"

[project.scripts]
codex-app-mcp = "codex_app_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_app_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# R11: live tests (real auth/inference/file operations) never run in the
# default suite; they require an explicit `pytest -m live` opt-in.
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that use real Codex auth/runtime; run explicitly with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Long assertion messages are part of these regression diagnostics.
"tests/regression/test_external_review.py" = ["E501"]
"tests/regression/test_followup_review.py" = ["E501"]
"tests/regression/previous_review_support.py" = ["E501"]
"tests/regression/test_review_v3.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
