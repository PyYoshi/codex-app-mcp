# codex-app-mcp v0.1 example configuration.
# Replace /absolute/path/to/repository with the workspace to allow.

[runtime]
mode = "bundled"  # Use the runtime matched to openai-codex.

[defaults]
model = "gpt-5.6-terra"
effort = "medium"
sandbox = "read-only"
approval_policy = "never"

[policy]
# This controls accepted cwd/thread locations; it is not a file-read sandbox.
allowed_roots = ["/absolute/path/to/repository"]
# Add models explicitly. The bridge never falls back automatically.
allowed_models = ["gpt-5.6-terra"]
allowed_sandboxes = ["read-only", "workspace-write"]

[limits]
max_active_turns = 1  # v0.1 supports one active turn per bridge process.
startup_timeout_seconds = 30
rpc_timeout_seconds = 30
turn_timeout_seconds = 900
interrupt_grace_seconds = 10
shutdown_grace_seconds = 5
max_input_bytes = 1048576
max_result_bytes = 1048576
progress_min_interval_seconds = 1

[logging]
level = "INFO"
format = "json"
# Logs use stderr. Prompts, answers, and credentials are not logged.
