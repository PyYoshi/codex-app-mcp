name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.61.0
      - name: Install pinned tools
        run: aqua install
      - name: Sync dependencies
        run: aqua exec -- uv sync --frozen --all-groups
      - name: Test
        run: aqua exec -- uv run --frozen pytest -m 'not live' -q
      - name: Lint
        run: aqua exec -- uv run --frozen ruff check src tests
      - name: Check formatting
        run: aqua exec -- uv run --frozen ruff format --check src tests
      - name: Build distributions
        run: aqua exec -- uv build
      - name: Scan working tree for secrets
        run: aqua exec -- betterleaks dir .
      - name: Scan Git history for secrets
        run: aqua exec -- betterleaks git . --platform github
